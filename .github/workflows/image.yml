# Publishes the OpenRive container image to the GitHub Container Registry.
#
#   push to main            ghcr.io/upstandplatform/openrive:edge
#   git push origin v1.2.3  :1.2.3, :1.2 and :latest
#   pull request            builds only, as a check that the Dockerfile still works
#
# Actions -> Image -> Run workflow also takes an extra tag, which is how the
# first :latest is published before the next release tag exists.
#
# One-time setup: the first push creates the package privately. Make it public
# under Organisation -> Packages -> openrive -> Package settings, or nobody can
# pull it without a token. GitHub links it to this repository automatically
# (org.opencontainers.image.source, set by docker/metadata-action).
#
# Each architecture builds on its own native runner (no QEMU: emulating a
# Next.js build is painfully slow) and is pushed by digest. The publish job
# then joins those digests into one multi-architecture tag, so `docker pull`
# gets the right one on amd64 and arm64 alike.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker-compose*.yml', '.github/workflows/image.yml']
  workflow_dispatch:
    inputs:
      extra_tag:
        description: Extra tag to publish as well (e.g. latest)
        type: string
        default: ''

env:
  IMAGE: ghcr.io/upstandplatform/openrive

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # the labels are baked into each architecture here; the publish job only
      # joins digests, which cannot add any
      - name: Image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=OpenRive
            org.opencontainers.image.description=Local-first, login-free editor for Rive .riv files
            org.opencontainers.image.url=https://openrive.upstand.dev

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # a pull request only has to prove the image still builds
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', 'ghcr.io/upstandplatform/openrive') }}
          # attestations cannot be attached to a digest-only push
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Keep the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for this build
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 'latest' comes with the semver tags (flavor latest=auto)
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      - name: Join the architectures into one tag
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.target."docker-metadata-action".tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: What was published
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo
            jq -r '.target."docker-metadata-action".tags[] | "- `" + . + "`"' <<< "${DOCKER_METADATA_OUTPUT_JSON}"
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
