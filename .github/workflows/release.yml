name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Validate shipped Rive assets
        run: bun run check:riv

      - name: Rive corpus round-trip
        run: |
          bun run rive:init
          bun run test:corpus -- vendor/rive-runtime/tests

      - name: MCP server
        run: bun run test:mcp
        env:
          OPENRIVE_DATA_DIR: ${{ runner.temp }}/openrive-release-mcp

      - name: Build
        run: bun run build

      - name: Dependency security audit
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $version" '
            $0 == heading { active = 1; next }
            /^## / && active { exit }
            active { print }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          gh release create "$RELEASE_TAG" --title "OpenRive $RELEASE_TAG" --notes-file "$notes_file"
