name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish after validation
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bunx playwright-core install --with-deps chromium && bun run test

      - name: Lottie JSON and TGS corpus
        run: bash scripts/test-lottie-corpus-ci.sh

      - name: Bone canvas workflows
        run: bun run test:browser

      - name: Validate shipped Rive assets
        run: bun run check:riv

      - name: Rive corpus round-trip
        run: |
          bun run rive:init
          bun run test:corpus -- vendor/rive-runtime/tests

      - name: MCP server
        run: bun run test:mcp
        env:
          OPENRIVE_DATA_DIR: ${{ runner.temp }}/openrive-release-mcp

      - name: Build
        run: bun run build

      - name: Dependency security audit
        run: bun audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          python - "$version" "$notes_file" <<'PY'
          import sys
          from pathlib import Path

          version, output = sys.argv[1:]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, line in enumerate(lines) if line.startswith(f"## {version} ")), None)
          if start is None:
              raise SystemExit(f"No changelog section found for {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          notes = "\n".join(lines[start + 1:end]).strip()
          if not notes:
              raise SystemExit(f"Changelog section for {version} is empty")
          Path(output).write_text(notes + "\n", encoding="utf-8")
          PY
          test -s "$notes_file"
          gh release create "$RELEASE_TAG" --title "OpenRive $RELEASE_TAG" --notes-file "$notes_file"
