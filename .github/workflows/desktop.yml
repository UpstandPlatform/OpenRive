# Builds the OpenRive desktop app (Electrobun) for macOS, Windows and Linux and
# publishes it as a GitHub release.
#
#   Actions -> Desktop -> Run workflow      picks the next version (patch by
#                                           default), tags it and releases
#   git push origin v1.2.3                  builds and releases that exact tag
#   pull request                            builds only, as a check
#
# Versions are tag-driven: the workflow stamps the computed version into the app
# before packaging, so no version-bump commit is needed. Electrobun does not
# cross-compile, so every target builds on its own runner.
name: Desktop

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['apps/desktop/**', 'apps/web/**', 'packages/**', 'scripts/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      bump:
        description: Version to release
        type: choice
        options: [patch, minor, major, none]
        default: patch
      channel:
        description: Electrobun build channel
        type: choice
        options: [stable, canary]
        default: stable
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      draft:
        description: Create the release as a draft
        type: boolean
        default: false
      release_version:
        description: Build and attach assets to an existing version (for example 0.1.0)
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the current version

      - name: Pick the version
        id: pick
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          REQUESTED_VERSION: ${{ inputs.release_version || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # a pushed tag is the version
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            release=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${REQUESTED_VERSION}" ]; then
            version="${REQUESTED_VERSION#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9_.-]+)?$ ]]; then
              echo "Invalid release version: ${REQUESTED_VERSION}" >&2
              exit 1
            fi
            tag="v${version}"
            release=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${BUMP}" != "none" ]; then
            latest="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)"
            [ -n "${latest}" ] || latest="v0.0.0"
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            patch="${patch%%-*}"   # drop any pre-release suffix
            case "${BUMP}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="${major}.${minor}.${patch}"
            tag="v${version}"
            release=true
            echo "Previous release: ${latest}"
          else
            # pull requests and dispatches with bump=none only produce artifacts
            version="0.0.0-build.${GITHUB_RUN_NUMBER}"
            tag=""
            release=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "### Desktop ${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${release}${tag:+ (tag ${tag})}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: windows-2025
            target: win-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev librsvg2-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - run: bun install --frozen-lockfile

      - name: Stamp the version
        shell: bash
        run: bun scripts/set-desktop-version.ts "${{ needs.version.outputs.version }}"

      # produces apps/desktop/build/server (Next.js standalone) that the bundle copies in
      - name: Build the web server bundle
        run: bun run --cwd apps/desktop build:server

      # Developer ID signing and notarization are optional: they turn on only when the repository has the
      # secrets listed in docs/signing.md. Without them the macOS bundle gets an ad-hoc seal instead
      # (apps/desktop/scripts/sign-macos.ts), which is valid but still asks users to approve the app once.
      - name: Import the Developer ID certificate
        id: mac-signing
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE}" ] || [ -z "${MACOS_DEVELOPER_ID}" ] || [ -z "${APPLE_TEAM_ID}" ] \
            || [ -z "${APPLE_ID}" ] || [ -z "${APPLE_APP_PASSWORD}" ]; then
            echo "No complete set of Apple signing secrets: building with the ad-hoc seal."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/openrive-signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "${MACOS_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/certificate.p12" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain}"
          security set-key-partition-list -S apple-tool:,apple: -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security find-identity -v -p codesigning "${keychain}"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build the desktop app
        working-directory: apps/desktop
        env:
          OPENRIVE_MAC_SIGNING: ${{ steps.mac-signing.outputs.mode || 'adhoc' }}
          # read by Electrobun when mac.codesign / mac.notarize are on (apps/desktop/electrobun.config.ts)
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.APPLE_TEAM_ID }}
          ELECTROBUN_APPLEID: ${{ secrets.APPLE_ID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bunx electrobun build --env=${{ inputs.channel || 'stable' }}

      # Proves what is actually shipped: the app inside the DMG (the one a browser download is quarantined and
      # assessed by Gatekeeper for) must have a valid signature. A bundle that fails this is the one macOS reports as
      # "damaged" without an Open Anyway button (issue #12). The updater archive's app is only reported: it is
      # installed by the app itself, not quarantined, and Electrobun rewrites its version.json after signing.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(artifacts/*.dmg)
          archives=(artifacts/*.app.tar.zst)
          if [ ${#dmgs[@]} -eq 0 ] || [ ${#archives[@]} -eq 0 ]; then
            echo "::error::expected a .dmg and a .app.tar.zst in apps/desktop/artifacts"; ls -la artifacts; exit 1
          fi
          show() {
            echo "--- $1"
            codesign -dv --verbose=2 "$1" 2>&1 | grep -E "Identifier|Signature|Authority|TeamIdentifier|Info.plist|Sealed Resources" || true
          }
          check() {
            show "$1"
            codesign --verify --deep --strict --verbose=2 "$1"
          }
          mount="$(mktemp -d)"
          hdiutil attach "${dmgs[0]}" -mountpoint "${mount}" -nobrowse -quiet
          app="$(find "${mount}" -maxdepth 2 -name '*.app' | head -1)"
          check "${app}"
          hdiutil detach "${mount}" -quiet
          extract="$(mktemp -d)"
          tar --zstd -xf "${archives[0]}" -C "${extract}" 2>/dev/null || (zstd -dc "${archives[0]}" | tar -xf - -C "${extract}")
          update_app="$(find "${extract}" -maxdepth 3 -name '*.app' | head -1)"
          show "${update_app}"
          if [ "${OPENRIVE_MAC_SIGNING:-adhoc}" = "developer-id" ]; then
            check "${update_app}"
            spctl --assess --type execute --verbose=2 "${update_app}"
          fi
        env:
          OPENRIVE_MAC_SIGNING: ${{ steps.mac-signing.outputs.mode || 'adhoc' }}

      # everything, including update.json, the .tar.zst bundles and the delta
      # patches: the in-app updater downloads them straight from the release
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrive-${{ matrix.target }}
          path: apps/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the tag
        if: github.ref_type != 'tag'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" -m "OpenRive ${TAG}"
            git push origin "${TAG}"
          fi

      # The release job creates tags with GITHUB_TOKEN. GitHub does not start
      # push-triggered workflows for those tags, so explicitly dispatch the
      # container workflow against the release tag.
      - name: Publish the matching container image
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh workflow run image.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      - name: Attach desktop assets to the selected existing release
        if: github.ref_type == 'tag' || inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${TAG}" artifacts/* --repo "${GITHUB_REPOSITORY}" --clobber
              exit 0
            fi
            echo "Release ${TAG} is not available yet (attempt ${attempt}/60); waiting for validation workflow."
            sleep 10
          done
          echo "Release ${TAG} was not created by the validation workflow." >&2
          exit 1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        if: github.ref_type != 'tag' && inputs.release_version == ''
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenRive ${{ needs.version.outputs.version }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            ## OpenRive ${{ needs.version.outputs.version }} — desktop

            | Platform | Download |
            | --- | --- |
            | macOS (Apple Silicon) | `macos-arm64-OpenRive.dmg` |
            | Windows | `win-x64-OpenRive-Setup.zip` |
            | Linux | `linux-x64-OpenRive-Setup.tar.gz` |

            The app carries its own editor and database, so nothing else has to be installed. Projects live in your
            user data folder; set `DATABASE_URL` before launching to share a PostgreSQL instead.

            Already running OpenRive? It updates itself: **user menu → Check for updates**. The `update.json`,
            `.tar.zst` and `.patch` files attached here are what that uses.

            These builds are not yet signed with a developer certificate, so macOS and Windows warn on first launch
            (see [Signing](https://github.com/${{ github.repository }}/blob/main/docs/signing.md)):

            - **macOS:** open the app once with right-click → **Open**, or approve it in **System Settings → Privacy &
              Security → Open Anyway**. If macOS says the app is damaged and offers no button (builds up to 0.2.7), run
              `xattr -dr com.apple.quarantine /Applications/OpenRive.app` once.
            - **Windows:** **SmartScreen → More info → Run anyway**.
