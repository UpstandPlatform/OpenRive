# Builds the OpenRive desktop app (Electrobun) for macOS, Windows and Linux and
# uploads the installers as workflow artifacts. Tagged runs also attach them to
# the GitHub release.
#
# Electrobun has no cross-compilation: every target builds on its own runner.
name: Desktop

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['apps/desktop/**', 'apps/web/**', 'packages/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        type: choice
        options: [stable, canary]
        default: stable

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos-arm64
          - os: windows-2025
            target: win-x64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev librsvg2-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake

      - run: bun install --frozen-lockfile

      # produces apps/desktop/build/server (Next.js standalone) that the bundle copies in
      - name: Build the web server bundle
        run: bun run --cwd apps/desktop build:server

      - name: Build the desktop app
        working-directory: apps/desktop
        run: bunx electrobun build --env=${{ inputs.channel || 'stable' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openrive-${{ matrix.target }}
          path: |
            apps/desktop/artifacts/*
            !apps/desktop/artifacts/**/*.patch
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/artifacts/*
          fail_on_unmatched_files: false
