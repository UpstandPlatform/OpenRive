# OpenRive in a single container, storing projects as files in a volume.
#   docker compose -f docker-compose.files.yml up -d
# Full guide: docs/self-hosting.md
services:
  openrive:
    build: .
    image: openrive
    restart: unless-stopped
    ports:
      - "${OPENRIVE_PORT:-3000}:3000"
    volumes:
      - openrive-data:/data
    environment:
      OPENRIVE_ACCESS_TOKEN: ${OPENRIVE_ACCESS_TOKEN:-}
volumes:
  openrive-data:
