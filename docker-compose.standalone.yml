# OpenRive in a single container, using the embedded PostgreSQL (PGlite) that
# lives in the data volume. No database server to run.
#   docker compose -f docker-compose.standalone.yml up -d
# To build the image from this checkout instead of pulling it:
#   docker compose -f docker-compose.standalone.yml -f docker-compose.build.yml up -d --build
# Full guide: docs/self-hosting.md
services:
  openrive:
    image: ghcr.io/upstandplatform/openrive:${OPENRIVE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${OPENRIVE_PORT:-3000}:3000"
    volumes:
      - openrive-data:/data
    environment:
      OPENRIVE_URL: ${OPENRIVE_URL:-http://localhost:3000}
      OPENRIVE_AUTH: ${OPENRIVE_AUTH:-on}
      OPENRIVE_SIGNUP: ${OPENRIVE_SIGNUP:-first}
      OPENRIVE_AUTH_SECRET: ${OPENRIVE_AUTH_SECRET:-}
      OPENRIVE_TRUSTED_ORIGINS: ${OPENRIVE_TRUSTED_ORIGINS:-}
      OPENRIVE_ACCESS_TOKEN: ${OPENRIVE_ACCESS_TOKEN:-}
volumes:
  openrive-data:
